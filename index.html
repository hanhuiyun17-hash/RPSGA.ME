<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>STONEBALL — The Hollow Crown</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#11100d;font-family:monospace;touch-action:none}
body{display:flex;justify-content:center}
#app{position:relative;width:100%;height:100%;max-width:520px;background:#171914;overflow:hidden}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
.hidden{display:none!important}
button,input{font:inherit}
button{cursor:pointer}

.panel{background:#c9aa70;color:#332417;border:5px solid #4b3421;box-shadow:inset 0 0 0 4px #8c673f,0 8px 0 #0c0a08}
.pixelBtn{min-height:44px;border:0;background:#69442a;color:#f5dfaa;font-weight:900;box-shadow:inset 0 0 0 4px #3d281a,0 5px 0 #21150e;padding:0 12px}
.pixelBtn:active{transform:translateY(3px);box-shadow:inset 0 0 0 4px #3d281a,0 2px 0 #21150e}

/* 시작 */
#titleScreen{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 78% 14%,#d5c58a 0 55px,#bca66c 56px 62px,transparent 63px),linear-gradient(rgba(9,12,10,.05),rgba(7,7,6,.75)),repeating-linear-gradient(90deg,#263727 0 44px,#2e3e2d 44px 88px)}
.titleCard{width:min(90%,390px);padding:20px 16px;text-align:center}
.gameTitle{font-size:30px;font-weight:900;letter-spacing:3px;margin-bottom:7px}
.sub{font-size:11px;line-height:1.6;color:#60472e;margin-bottom:14px}
.titleActions{display:grid;gap:9px}

/* 슬롯 */
#setupScreen{position:absolute;inset:0;z-index:45;display:flex;align-items:center;justify-content:center;padding:12px;background:linear-gradient(#273528,#141d16)}
.setupCard{width:min(96%,430px);padding:14px}
.setupTitle{text-align:center;font-size:20px;font-weight:900;margin-bottom:5px}
.setupDesc{text-align:center;font-size:11px;line-height:1.6;color:#5c452f;margin-bottom:12px}
#nameInput{width:100%;height:44px;border:4px solid #5c3f28;background:#ecd59d;color:#302116;padding:0 10px;outline:none;font-size:16px;margin-bottom:12px}
.slotWrap{display:grid;grid-template-columns:1fr 62px;gap:8px}
.slotMachine{background:#34271b;border:5px solid #4b3420;box-shadow:inset 0 0 0 4px #8d673a;padding:10px 8px 12px}
.reels{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.reelLabel{text-align:center;color:#e8d09a;font-weight:900;font-size:10px;margin-bottom:5px}
.reelWindow{height:68px;position:relative;overflow:hidden;background:#efe0b5;border:4px solid #67492b;box-shadow:inset 0 0 0 3px #b49359}
.reelNum{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;color:#302216}
.reelNum.spinning{animation:slotJitter .07s linear infinite}
@keyframes slotJitter{0%{transform:translateY(-8px)}50%{transform:translateY(8px)}100%{transform:translateY(-8px)}}
.slotSide{display:flex;align-items:center;justify-content:center;border:5px solid #4b3420;background:#7f5a34;box-shadow:inset 0 0 0 4px #a97b46}
#slotButton{width:38px;height:38px;border-radius:50%;border:5px solid #4e241e;background:#a5332b;box-shadow:0 5px 0 #4c211d,inset 0 0 0 3px #d55d51}
.totalLine{text-align:center;color:#f0d9a6;font-size:11px;font-weight:900;margin-top:7px}
#slotMessage{min-height:36px;text-align:center;font-size:11px;line-height:1.5;color:#4d3827;margin-top:9px}
#statsSetup{margin-top:8px;border-top:3px solid #8a643b;padding-top:7px}
.statRow{display:grid;grid-template-columns:62px 1fr 30px;gap:7px;align-items:center;padding:4px 2px;font-size:11px}
.statBar{height:11px;border:3px solid #553923;background:#9f7b49}
.statFill{height:100%;background:#4e693e;width:0}
.setupActions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}

/* 지도 */
#mapScreen{position:absolute;inset:0;z-index:30;background:linear-gradient(#202b22,#141a15);padding:12px;overflow:auto}
.mapTop{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.mapTitle{color:#ead6a4;font-weight:900;font-size:16px}
#mapArea{position:relative;min-height:630px;border:4px solid #4a3826;background:linear-gradient(#344236,#263127);box-shadow:inset 0 0 0 3px #1f251f}
.mapNode{position:absolute;width:108px;min-height:62px;padding:6px;border:4px solid #4a3422;background:#c7a76d;color:#332317;text-align:center;font-weight:900;font-size:10px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 #21170f}
.mapNode.locked{filter:brightness(.55)}
.mapNode.boss{background:#a96858}
.mapNode.chest{background:#d0b36f}
.mapNode.elite{background:#b27a5e}

/* 전투 HUD */
#hud{position:absolute;z-index:8;left:7px;right:7px;top:7px;display:flex;gap:6px;pointer-events:none}
.hudBox{background:#c8aa72;border:3px solid #4e3723;box-shadow:inset 0 0 0 2px #88643d;color:#332418;font-size:10px;padding:5px 7px;min-width:70px}
#statButton,#deckButton{pointer-events:auto;min-height:38px;border:3px solid #4e3723;background:#725035;color:#f2dba8;font-weight:900;padding:0 8px}
#turnBadge{position:absolute;z-index:8;top:58px;left:50%;transform:translateX(-50%);background:#5b4027;color:#f2dda8;border:3px solid #927049;padding:5px 10px;font-size:11px}
#battleInfo{position:absolute;z-index:8;left:50%;bottom:9px;transform:translateX(-50%);min-width:210px;max-width:92%;text-align:center;padding:8px 12px;background:#36281c;border:3px solid #997043;color:#f1d9a0;font-size:11px}

/* 보유 공 표시: 다음 순서 숨기고 존재만 */
#ownedOrbs{
  position:absolute;z-index:8;left:8px;right:8px;bottom:60px;
  display:flex;gap:5px;overflow-x:auto;padding-bottom:3px;pointer-events:none
}
.ownedChip{
  flex:0 0 auto;min-width:48px;padding:5px 6px;border:3px solid #4c3522;
  color:#1f1710;font-size:8px;text-align:center;font-weight:900;
  box-shadow:0 3px 0 #1c130d
}
.ownedChip.current{transform:translateY(-4px);outline:2px solid #f6e0a6}

/* 피해 연출 */
#damageFlash{position:absolute;inset:0;z-index:14;pointer-events:none;opacity:0;background:radial-gradient(circle at center,transparent 25%,rgba(120,0,0,.15) 55%,rgba(160,0,0,.75) 100%)}
#damageFlash.hit{animation:damageFlash .35s ease-out}
@keyframes damageFlash{0%{opacity:0}20%{opacity:1}100%{opacity:0}}
#floatingDamage{position:absolute;z-index:15;left:18%;top:18%;font-size:28px;font-weight:900;color:#ffb0a6;text-shadow:3px 3px 0 #4d1410;pointer-events:none;opacity:0}
#floatingDamage.show{animation:floatDamage .65s ease-out}
@keyframes floatDamage{0%{opacity:0;transform:translateY(10px) scale(.8)}20%{opacity:1}100%{opacity:0;transform:translateY(-35px) scale(1.15)}}

/* 팝업 */
.overlay{position:absolute;inset:0;z-index:60;background:#0d0a08c2;display:flex;align-items:center;justify-content:center;padding:14px}
.popup{width:min(94%,430px);max-height:88vh;overflow:auto;padding:14px}
.popup h3{margin:0 0 10px;text-align:center}
.popupClose{width:100%;margin-top:10px}
.choiceGrid{display:grid;gap:8px}
.choiceCard{border:4px solid #59402a;background:#e2c98f;padding:10px;color:#322317}
.choiceCard b{display:block;margin-bottom:4px}
.choiceCard button{width:100%;margin-top:8px}
.statusTag{display:inline-block;padding:2px 5px;margin:2px;border:2px solid #5b442f;background:#d6bb80;font-size:9px}
#messageOverlay{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:#100c087d;color:#f2dba6;font-size:20px;font-weight:900;text-align:center;pointer-events:none}

:root{--gold:#e2b967;--ink:#171c21}
#titleScreen{background:radial-gradient(ellipse at 50% 20%,#43525855,transparent 55%),repeating-linear-gradient(90deg,#10191d 0 48px,#142024 48px 96px)}
.titleCard{background:#1d282b;color:#f3dfae;border-color:#6c6650;padding:35px 16px;box-shadow:inset 0 0 0 3px #303d3e,0 12px 35px #0009}
.gameTitle{font-size:clamp(30px,9vw,45px);letter-spacing:3px;text-shadow:3px 4px #090f12;color:#ead49e}.subtitle{font-size:10px;letter-spacing:4px;color:#97aaa3;margin:9px 0 30px}.titleCard .sub{color:#adbbb1}
#coinBadge{position:absolute;right:12px;top:57px;z-index:55;display:flex;align-items:center;gap:6px;background:#182225;border:2px solid #76613a;color:#f2cf7c;padding:4px 7px;font-size:11px;font-weight:bold;pointer-events:none}#coinBadge i{width:12px;height:14px;background:#d8a649;border:2px solid #f2d481;box-shadow:inset -3px 0 #8d602d;display:block}
#hud{gap:3px;right:5px;left:5px}.hudBox{min-width:0;padding:5px;font-size:9px}#hud button{font-size:10px;padding:0 5px;min-height:38px}#bagButton{pointer-events:auto;background:#496157;color:#ead9b3;border:3px solid #273a35}
#mapScreen{background:radial-gradient(ellipse at top,#33413b,#10191d);padding-top:18px}.mapTitle{font-size:20px;letter-spacing:2px}#mapArea{background:repeating-linear-gradient(0deg,#1c2927 0 68px,#21302d 68px 70px);min-height:820px;border-color:#64705a}.mapNode{width:128px;min-height:67px;background:#34473f;color:#e0d9b3;border:2px solid #829076;box-shadow:0 5px #0b1715;line-height:1.6}.mapNode.locked{filter:brightness(.5)}.mapNode.boss{background:#5a303c;border-color:#b6817d}.mapNode.chest{background:#685737}.mapNode.elite{background:#634333}.mapNode.done{opacity:.45}.mapNode small{color:#b1bda9;font-size:9px}.mapPath{position:absolute;left:50%;top:15px;bottom:35px;border-left:3px dashed #9c9a6266}
.popup .pixelBtn{margin-top:6px}.shopHeader{padding:10px;background:#33483d;color:#f0ddb2;margin-bottom:10px;font-size:12px;line-height:1.8}.itemRow{margin-bottom:9px}.itemRow button:disabled{opacity:.4;cursor:default}#ownedOrbs{pointer-events:auto}.ownedChip{cursor:pointer}.statusTag{background:#32483d;color:#e2e7c0;border-color:#64846a}

.gameIcon{width:32px;height:32px;flex:none;image-rendering:pixelated;shape-rendering:crispEdges;vertical-align:middle}.shopHeader{display:flex;align-items:center;gap:9px}.shopHeader span{margin-left:auto;font-size:11px}.shopRow{display:grid;grid-template-columns:36px 1fr 76px;align-items:center;gap:8px;padding:10px}.shopRow b{font-size:12px;margin:0 0 4px}.shopRow small{font-size:10px}.shopRow button{margin:0;padding:0 4px;font-size:11px}.shopRow button:disabled{opacity:.35}.ownedChip{position:relative;background:#263330!important;min-width:48px;height:57px;padding:4px;border:2px solid #59665b;color:#e2d4aa;display:flex;flex-direction:column;align-items:center;justify-content:center}.ownedChip small{font-size:9px}.ownedChip em{position:absolute;right:0;top:0;background:#152320;color:#f2d18a;font-size:9px;font-style:normal}.ownedChip.current{border-color:#e1bf65;outline:none;background:#42452e!important}.ownedChip.spent{opacity:.3}.ownedChip:disabled{cursor:default}#ownedOrbs{bottom:56px;gap:6px}.popup small{line-height:1.4}

.ownedChip small,.bagTile small{color:#fff;font-size:12px;font-weight:900;text-shadow:1px 1px #000}.bagGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px}.bagTile{background:#283731;border:2px solid #718173;color:#fff;padding:7px;display:flex;align-items:center;flex-direction:column;min-height:55px}.rewardTiles{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:10px}.rewardTile{padding:10px 3px;display:flex;align-items:center;flex-direction:column;gap:7px;font-size:11px;cursor:pointer}.rewardTile.selected{outline:3px solid #749ca1}.rewardInfo{min-height:75px}#levelToast{position:absolute;left:0;right:0;top:25%;z-index:80;text-align:center;font-size:28px;font-weight:900;color:#f5d983;text-shadow:3px 3px #171b24;pointer-events:none;opacity:0}#levelToast.rise{animation:levelRise 1.8s ease-out}@keyframes levelRise{0%{opacity:0;transform:translateY(20px)}20%,65%{opacity:1}100%{opacity:0;transform:translateY(-35px)}}
</style>
</head>
<body>
<div id="app">
<canvas id="game"></canvas>

<div id="titleScreen">
  <div class="titleCard panel">
    <div class="gameTitle">STONEBALL</div><div class="subtitle">THE HOLLOW CROWN</div>
    <div class="sub">뼈만 남은 방랑자, 공허의 왕관을 깨뜨려라.<br>돌을 모아 여덟 층을 돌파하세요</div>
    <div class="titleActions">
      <button id="continueBtn" class="pixelBtn hidden">이어하기</button>
      <button id="newGameBtn" class="pixelBtn">게임 시작하기</button>
    </div>
  </div>
</div>

<div id="setupScreen" class="hidden">
  <div class="setupCard panel">
    <div class="setupTitle">능력치 슬롯 머신</div>
    <div class="setupDesc">체력, 행운, 공격력, 방어력의 총합은 항상 12입니다.</div>
    <input id="nameInput" maxlength="10" placeholder="캐릭터 이름">
    <div class="slotWrap">
      <div class="slotMachine">
        <div class="reels">
          <div><div class="reelLabel">체력</div><div class="reelWindow"><div id="reel0" class="reelNum">?</div></div></div>
          <div><div class="reelLabel">행운</div><div class="reelWindow"><div id="reel1" class="reelNum">?</div></div></div>
          <div><div class="reelLabel">공격력</div><div class="reelWindow"><div id="reel2" class="reelNum">?</div></div></div>
          <div><div class="reelLabel">방어력</div><div class="reelWindow"><div id="reel3" class="reelNum">?</div></div></div>
        </div>
        <div class="totalLine">총합 <span id="totalStat">0</span> / 12</div>
      </div>
      <div class="slotSide"><button id="slotButton" aria-label="슬롯 작동"></button></div>
    </div>
    <div id="slotMessage">오른쪽 빨간 버튼을 눌러 슬롯을 작동시키세요.</div>
    <div id="statsSetup" class="hidden">
      <div class="statRow"><span>체력</span><div class="statBar"><div id="bar0" class="statFill"></div></div><b id="stat0">0</b></div>
      <div class="statRow"><span>행운</span><div class="statBar"><div id="bar1" class="statFill"></div></div><b id="stat1">0</b></div>
      <div class="statRow"><span>공격력</span><div class="statBar"><div id="bar2" class="statFill"></div></div><b id="stat2">0</b></div>
      <div class="statRow"><span>방어력</span><div class="statBar"><div id="bar3" class="statFill"></div></div><b id="stat3">0</b></div>
      <div class="setupActions">
        <button id="rerollBtn" class="pixelBtn">다시 하기</button>
        <button id="startRunBtn" class="pixelBtn">이 능력치로 시작</button>
      </div>
    </div>
  </div>
</div>

<div id="mapScreen" class="hidden">
  <div class="mapTop">
    <div class="mapTitle">던전 지도</div>
    <button id="mapBagBtn" class="pixelBtn">가방</button><button id="mapStatBtn" class="pixelBtn">능력치</button>
  </div>
  <div id="mapArea"></div>
</div>

<div id="hud" class="hidden">
  <div class="hudBox"><b id="hudName">-</b><br>체력 <span id="hudHp">0</span></div>
  <div class="hudBox">스테이지 <b id="hudStage">1</b><br>전투 <span id="hudBattle">1</span>/5</div>
  <div class="hudBox">적 <span id="hudEnemyCount">1</span></div>
  <button id="statButton">능력치</button>
  <button id="deckButton">공</button><button id="bagButton">가방</button>
</div>
<div id="turnBadge" class="hidden">내 공격</div>
<div id="battleInfo" class="hidden">공을 고르고 조준하세요</div>
<div id="ownedOrbs" class="hidden"></div>
<div id="damageFlash"></div>
<div id="floatingDamage"></div><div id="levelToast"></div>
<div id="messageOverlay" class="hidden"><div id="messageText"></div></div>

<div id="popupOverlay" class="overlay hidden">
  <div class="popup panel">
    <h3 id="popupTitle"></h3>
    <div id="popupBody"></div>
    <button id="popupClose" class="pixelBtn popupClose">닫기</button>
  </div>
</div>

<script>
(() => {
const SAVE_KEY="stoneball_v4";
const $=s=>document.querySelector(s);
const canvas=$("#game"),ctx=canvas.getContext("2d");
ctx.imageSmoothingEnabled=false;

const titleScreen=$("#titleScreen"),continueBtn=$("#continueBtn"),newGameBtn=$("#newGameBtn");
const setupScreen=$("#setupScreen"),nameInput=$("#nameInput"),slotButton=$("#slotButton"),slotMessage=$("#slotMessage"),statsSetup=$("#statsSetup");
const mapScreen=$("#mapScreen"),mapArea=$("#mapArea"),mapStatBtn=$("#mapStatBtn");
const hud=$("#hud"),turnBadge=$("#turnBadge"),battleInfo=$("#battleInfo"),ownedOrbs=$("#ownedOrbs");
const damageFlash=$("#damageFlash"),floatingDamage=$("#floatingDamage");
const statButton=$("#statButton"),deckButton=$("#deckButton"),messageOverlay=$("#messageOverlay"),messageText=$("#messageText");
const popupOverlay=$("#popupOverlay"),popupTitle=$("#popupTitle"),popupBody=$("#popupBody"),popupClose=$("#popupClose");
const reelEls=[0,1,2,3].map(i=>$("#reel"+i)),statEls=[0,1,2,3].map(i=>$("#stat"+i)),barEls=[0,1,2,3].map(i=>$("#bar"+i));
const totalStat=$("#totalStat"),rerollBtn=$("#rerollBtn"),startRunBtn=$("#startRunBtn");
const hudName=$("#hudName"),hudHp=$("#hudHp"),hudStage=$("#hudStage"),hudBattle=$("#hudBattle"),hudEnemyCount=$("#hudEnemyCount");

let W=0,H=0,DPR=1,mode="title",rolling=false;
let stats=[0,0,0,0];
let run={
  name:"",stage:1,battleInStage:1,region:1,hp:100,maxHp:100,statPoints:0,
  deck:[],drawPile:[],discardPile:[],currentOrb:null,map:null,currentNode:null,
  killed:0,winsSinceOrbReward:0
};
let enemies=[],pegs=[],blocks=[],particles=[],turn="player",damage=0,hitCount=0,critical=false,screenShake=0,attackLocked=false;
let projectiles=[];
let stone={x:0,y:0,vx:0,vy:0,r:8,active:false,aiming:false,color:"#888",trail:[]};
let aimX=0,aimY=0;

/* 100종 공: 10속성 x 10형태 */
const THEMES=[
  {k:"기본",color:"#88867b",effect:"normal",status:"없음"},
  {k:"흡혈",color:"#8f3644",effect:"leech",status:"흡혈"},
  {k:"화염",color:"#d85a2f",effect:"fire",status:"화상"},
  {k:"독",color:"#6c9a3d",effect:"poison",status:"독"},
  {k:"서리",color:"#8bc4d8",effect:"frost",status:"빙결"},
  {k:"번개",color:"#d6c34b",effect:"lightning",status:"번개"},
  {k:"유령",color:"#b8acd8",effect:"ghost",status:"유령"},
  {k:"폭발",color:"#c77a34",effect:"bomb",status:"폭발"},
  {k:"자석",color:"#4d7b89",effect:"magnet",status:"자석"},
  {k:"혼돈",color:"#a5539a",effect:"chaos",status:"혼돈"}
];
const FORMS=[
  {k:"돌",base:2.0,speed:7.8,r:8,desc:"균형 잡힌 공"},
  {k:"구슬",base:2.2,speed:8.2,r:7,desc:"조금 빠른 공"},
  {k:"거석",base:2.7,speed:6.1,r:12,desc:"크고 무거운 공"},
  {k:"탄환",base:2.3,speed:9.2,r:6,desc:"매우 빠른 공"},
  {k:"철구",base:2.6,speed:7.1,r:9,desc:"기본 피해가 높은 공"},
  {k:"별",base:1.9,speed:8.4,r:8,desc:"연속 충돌에 유리한 공"},
  {k:"파편",base:1.8,speed:8.8,r:6,desc:"가볍고 빠른 공"},
  {k:"핵",base:3.0,speed:6.6,r:10,desc:"강하지만 둔한 공"},
  {k:"진주",base:2.0,speed:7.5,r:8,desc:"특수효과가 안정적인 공"},
  {k:"수정",base:2.4,speed:7.3,r:9,desc:"강화 효율이 좋은 공"}
];
const ORBS=[];
let oid=0;
for(const t of THEMES){
  for(const f of FORMS){
    ORBS.push({
      id:"orb"+(++oid),
      name:(t.k==="기본"?"":t.k+"의 ")+f.k,
      color:t.color,effect:t.effect,status:t.status,rarity:oid%25===0?"전설":oid%7===0?"영웅":oid%3===0?"희귀":"일반",
      base:f.base,speed:f.speed,r:f.r,
      desc:f.desc,
      upgrade:["피해 7% 증가","피해와 속성 강화","피해와 속성 강화"]
    });
  }
}

/* 판 배치 */
function createBoard(type){
  pegs=[];blocks=[];
  const easy=run.stage<=2;const luck=Math.min(12,stats[1])/12;
  const top=H*.35,bottom=H*.79;
  const rows=type==="boss"?10:type==="chest"?6:(easy?8:7);
  const cols=type==="boss"?8:type==="chest"?5:(W<390?6:7);
  const gx=W/(cols+1)*(1-luck*.06),gy=(bottom-top)/Math.max(1,rows-1);
  const patterns=easy?["dense","triangle","zigzag"]:run.stage<5?["triangle","zigzag","gap","tunnel","stairs","split","doublegap","walls","diamond","columns","checker","funnel"]:["gap","tunnel","stairs","split","doublegap","walls","diamond","columns","checker","funnel","hourglass","cross","islands","ramp","spiral","pinch","arch","fortress","maze","offset"];
  const pool=patterns.filter(x=>x!==run.lastPattern);const pattern=type==="boss"?["dense","zigzag","split","diamond","dense"][run.battleInStage-1]:pool[Math.floor(Math.random()*pool.length)];run.lastPattern=pattern;run.boardName=pattern;

  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    let x=gx+c*gx+(r%2?gx*.5:0),y=top+r*gy;
    if(pattern==="zigzag")x+=Math.sin(r*1.3)*gx*.23;
    if(x>W-gx*.55)continue;
    if(pattern==="gap"&&Math.abs(x-W*.5)<gx*(.65-luck*.15)&&r>1&&r<rows-2)continue;
    if(pattern==="doublegap"&&((x>W*.25&&x<W*.4)||(x>W*.62&&x<W*.77))&&r>1)continue;
    if(pattern==="split"&&r%2===1&&c%3===1)continue;
    if(pattern==="stairs"&&c<Math.floor(r/2)-1)continue;
    if(pattern==="triangle"&&Math.abs(c-(cols-1)/2)>r*.45+1)continue;
    if(pattern==="diamond"&&Math.abs(c-(cols-1)/2)+Math.abs(r-(rows-1)/2)*.6>cols*.53)continue;
    if(pattern==="columns"&&c%3===1)continue;
    if(pattern==="checker"&&(r+c)%3===0)continue;
    if(pattern==="funnel"&&Math.abs(c-(cols-1)/2)<(rows-r)*.25)continue;
    if(pattern==="hourglass"&&Math.abs(c-(cols-1)/2)<(rows/2-Math.abs(r-rows/2))*.35)continue;
    if(pattern==="cross"&&(Math.abs(c-(cols-1)/2)<1||Math.abs(r-(rows-1)/2)<1))continue;
    if(pattern==="islands"&&c%3===1&&r%3===1)continue;
    if(pattern==="ramp"&&c<r%cols-1)continue;
    if(pattern==="spiral"&&r%3===0&&c>cols/2)continue;
    if(pattern==="pinch"&&r>1&&r<rows-2&&Math.abs(c-(cols-1)/2)<1.5)continue;
    if(pattern==="arch"&&r<3&&c>1&&c<cols-2)continue;
    if(pattern==="fortress"&&r>1&&r<rows-1&&c>1&&c<cols-2)continue;
    if(pattern==="maze"&&(r%3===1?c<cols-2:c>1)&&r%2===1)continue;
    if(pattern==="offset"&&r%2===0&&c%3===0)continue;
    x+=W*luck*.03;
    x+=(Math.random()-.5)*(easy?4:14);
    y+=(Math.random()-.5)*(easy?3:9);
    const chance=critChance();
    pegs.push({x,y,r:9,dead:false,hit:false,type:Math.random()<chance?"critical":"normal"});
  }

  if(!easy&&type!=="chest"){
    if(pattern==="tunnel"){
      blocks.push({x:W*.18,y:H*.48,w:W*.24,h:14},{x:W*.58,y:H*.48,w:W*.24,h:14});
    }else if(pattern==="walls"){
      blocks.push({x:W*.34,y:H*.46,w:16,h:H*.16},{x:W*.66,y:H*.56,w:16,h:H*.16});
    }else{
      blocks.push({x:W*.38,y:H*.52,w:W*.24,h:14});
    }
    const extra=Math.min(Math.floor((run.stage-2)/2),4);
    for(let i=0;i<extra;i++){
      const horiz=Math.random()<.5;
      blocks.push({x:W*(.12+Math.random()*.7),y:H*(.42+Math.random()*.3),w:horiz?W*(.12+Math.random()*.14):16,h:horiz?14:H*(.06+Math.random()*.09)});
    }

function updateProjectile(){
  if(!stone.active)return;
  stone.flight=(stone.flight||0)+1;if(stone.flight>1500){stone.active=false;return}
  const d=orbDef(run.currentOrb.id);

  if(d.effect==="magnet"){
    let nearest=null,nd=9999;
    for(const p of pegs)if(!p.dead){const dist=Math.hypot(stone.x-p.x,stone.y-p.y);if(dist<nd){nd=dist;nearest=p}}

  stone.vy+=.105;stone.x+=stone.vx;stone.y+=stone.vy;
  stone.trail.push({x:stone.x,y:stone.y,life:14});
  if(stone.trail.length>18)stone.trail.shift();

  if(stone.x<stone.r+5){stone.x=stone.r+5;stone.vx=Math.abs(stone.vx)*.96}
  if(stone.x>W-stone.r-5){stone.x=W-stone.r-5;stone.vx=-Math.abs(stone.vx)*.96}
  for(const b of blocks)if(circleRect(stone.x,stone.y,stone.r,b))reflectBlock(b,d);

  for(const p of pegs){
    if(p.dead)continue;

    if(dist<min){
      const dd=dist||1,nx=dx/dd,ny=dy/dd;stone.x=p.x+nx*min;stone.y=p.y+ny*min;
      const dot=stone.vx*nx+stone.vy*ny;
      stone.vx=(stone.vx-2*dot*nx)*.975;stone.vy=(stone.vy-2*dot*ny)*.975;

      if(!p.hit){
        p.hit=true;if(!p.permanent)p.dead=true;hitCount++;if(mode==="treasure"){run.treasure.broken++;saveGame()}addFx(d.effect,p.x,p.y);
        if(p.type==="guard")run.shield=Math.min(18,(run.shield||0)+Math.round(2+run.stage*.6));
        let base=pegDamage(d,run.currentOrb.level||0);
        damage+=base;if(p.type==="critical")critical=true;battleInfo.textContent=mode==="treasure"?"파괴 "+run.treasure.broken+" / "+run.treasure.total:(critical?"치명타 ":"")+shotDamage(damage,critical)+" 피해";
        spawnParticles(p.x,p.y,d.color,d.effect==="lightning"?10:6);

        if(d.effect==="bomb"){
          for(const q of pegs)if(!q.dead&&!q.permanent&&Math.hypot(q.x-p.x,q.y-p.y)<(combo("bomb")?72:hasRune(5)?60:48)){q.dead=true;damage+=pegDamage(d,run.currentOrb.level||0)*.18;spawnParticles(q.x,q.y,d.color,4)}

}
function updateStone(){
 if(!stone.active)return;
 const root=stone;
 if(!projectiles.length)projectiles=[{...root,trail:root.trail.slice()}];
 for(const ball of projectiles)if(ball.active){stone=ball;updateProjectile()}
 stone=root;root.active=projectiles.some(b=>b.active);

function finishPlayerTurn(){
  if(mode==="treasure"){treasureResult();return}
  if(attackLocked)return;attackLocked=true;stone.active=false;
  const d=orbDef(run.currentOrb.id),target=livingEnemies().find(e=>e.uid===run.targetUid)||livingEnemies()[0];
  let finalDamage=shotDamage(damage,critical);

  if(target){
    target.hp=Math.max(0,target.hp-finalDamage);
    const lv=run.currentOrb.level||0;
    if(d.effect==="leech"){addFx("heal",W*.79,H*.205,40);}
    if(d.effect==="leech")run.hp=Math.min(run.maxHp,run.hp+Math.max(1,Math.round(finalDamage*(.14+lv*.025+(combo("leech")?.1:hasRune(2)?.05:0)))));
    if(d.effect==="poison")target.status.poison=Math.min(24,target.status.poison+Math.round((1+lv)*stagePower()+(combo("poison")?3:hasRune(3)?2:0)));
    if(d.effect==="fire")target.status.burn=Math.min(30,target.status.burn+Math.round((2+lv)*stagePower()+(combo("fire")?3:hasRune(0)?2:0)));
    if(d.effect==="frost")target.status.frost+=1+lv+(hasRune(1)?1:0);
    if(d.effect==="frost"&&hitCount>0&&combo("frost"))run.barrierHits=Math.min(5,(run.barrierHits||0)+1);

    if(d.effect==="guard"&&hitCount>=3){run.barrierHits=Math.min(5,(run.barrierHits||0)+2+(combo("guard")||hasRune(18)||hasRune(8)?1:0));addFx("guard",W*.13,H*.205,45)}
    awardKills();

function enemyTurn(){

  if(["battle","boss","chest","treasure"].includes(mode))updateStone();
  tick++;effects.forEach(f=>f.age++);effects=effects.filter(f=>f.age<f.life);for(const ball of [stone,...projectiles]){ball.trail.forEach(t=>t.life--);ball.trail=ball.trail.filter(t=>t.life>0)}
  updateParticles();if(screenShake>.1)screenShake*=.82;else screenShake=0;

 if(combo("ghost")&&o.effect==="ghost"&&mode==="boss")choices.push(1.18);return Math.max(...choices);
}
function runeIcon(id){const colors=["#d27552","#88b7c7","#ad5770","#8aad64","#cfb05d","#ac845f"];const n=id%6;const marks=['M11 4h2v16h-2zM5 10h14v3H5z','M5 5h14v3H5zM11 8h3v12h-3z','M5 5h3v14H5zM8 16h12v3H8z','M5 5h14v14H5zM8 8v8h8V8z','M12 4l8 16h-4l-4-9-4 9H4z','M4 10h6V4h4v6h6v4h-6v6h-4v-6H4z'];return '<svg class="gameIcon" viewBox="0 0 24 24" aria-hidden="true"><path fill="#080c0f" d="M4 0h16l4 4v16l-4 4H4l-4-4V4z"/><path fill="'+colors[n]+'" d="M5 2h14l3 3v14l-3 3H5l-3-3V5z"/><path fill="#1c292d" fill-rule="evenodd" d="'+marks[n]+'"/><path fill="#f0dec3" d="M'+(3+Math.floor(id/6)*4)+' 21h3v2h-3z"/></svg>'}
function grantRune(id){run.runes=normalizeRunes(run.runes);if(runeCount(id)>=(id===30?2:1))return false;run.runes.push(id);if(id===14&&stats[0]>0){const before=run.maxHp;run.maxHp=hpFor(stats[0]);run.hp=Math.min(run.maxHp,run.hp+run.maxHp-before)}return true}
function startTreasure(){
 run.pending="treasure";run.treasure={shotUsed:false,broken:0,total:0,choices:null};run.currentOrb={id:"orb1",level:0,uid:"treasure"};enemies=[];showMode("treasure");createBoard("chest");pegs.forEach(p=>{p.permanent=false;p.type="normal"});run.treasure.total=pegs.length;resetStone();turnBadge.textContent="상자방  남은 기회 1";battleInfo.textContent="많이 부술수록 좋은 보상이 나옵니다";ownedOrbs.classList.add("hidden");saveGame();
}
function treasureResult(){
 stone.active=false;stone.aiming=false;attackLocked=true;const t=run.treasure;if(!t)return;
 const ratio=t.broken/Math.max(1,t.total);t.heal=Math.max(10,Math.round(run.maxHp*(.2+ratio*.5)));
 if(!t.choices){const rank={일반:0,희귀:1,영웅:2,전설:3};const minimum=ratio>=.65?2:ratio>=.3?1:0;const pool=shuffle(ORBS.slice(1).filter(o=>rank[o.rarity]>=minimum));t.choices=pool.slice(0,2).map(o=>({kind:"orb",id:o.id}));const available=shuffle(RUNES.filter(r=>runeCount(r.id)<(r.id===30?2:1)));t.choices.push(available.length?{kind:"rune",id:available[0].id}:{kind:"orb",id:pool[2].id})}
 run.pending="treasure_reward";showChoiceCards(t.choices,()=>finishTreasure(),t.heal,"상자 보상",false);saveGame();
}
function finishTreasure(){run.treasure=null;run.pending=null;run.currentOrb=null;attackLocked=false;closePopup();showMap();saveGame()}
function showChoiceCards(choices,done,heal,title,upgrade){
 popupTitle.textContent=title;popupBody.innerHTML="";const grid=document.createElement("div");grid.className="rewardTiles";
 const info=document.createElement("div");info.className="choiceCard rewardInfo";info.textContent="아이콘을 눌러 확인하세요";
 const take=document.createElement("button");take.className="pixelBtn";take.textContent="선택하기";take.disabled=true;let selected=null;
 choices.forEach(choice=>{const o=choice.kind==="rune"?RUNES[choice.id]:orbDef(choice.id);const b=document.createElement("button");b.className="choiceCard rewardTile";b.innerHTML=(choice.kind==="rune"?runeIcon(o.id):orbIcon(o))+'<span>'+o.name+'</span>';b.onclick=()=>{selected=choice;for(const x of grid.children)x.classList.remove("selected");b.classList.add("selected");info.innerHTML='<b>'+o.name+'</b>'+o.desc+(choice.kind==="rune"?(o.id===30?'<br>현재 '+runeCount(30)+'개 보유':'<br>같은 효과는 중첩되지 않습니다.'):'<br>'+o.rarity);take.disabled=false};grid.appendChild(b)});
 take.onclick=()=>{if(!selected)return;if(selected.kind==="rune"){grantRune(selected.id);closePopup();done();saveGame()}else addRewardOrb(orbDef(selected.id),done)};
 popupBody.appendChild(grid);popupBody.appendChild(info);popupBody.appendChild(take);
 if(upgrade&&run.deck.some(o=>o.level<3)){const b=document.createElement("button");b.className="pixelBtn";b.textContent="돌 강화";b.onclick=()=>showUpgradeChoices(done);popupBody.appendChild(b)}
 const healBtn=document.createElement("button");healBtn.className="pixelBtn";healBtn.textContent="체력 "+heal+" 회복";healBtn.onclick=()=>{run.hp=Math.min(run.maxHp,run.hp+heal);closePopup();done();saveGame()};popupBody.appendChild(healBtn);
 popupClose.style.display="";popupClose.textContent="건너뛰기";popupClose.onclick=()=>{closePopup();done();saveGame()};openPopup();
}
let spriteParts=null,effects=[],tick=0;
function beginSprite(){spriteParts=[]}
function endSprite(){const parts=spriteParts;spriteParts=null;for(const [x,y,w,h,c]of parts)if(!c.includes("0005"))px(x-2,y-2,w+4,h+4,"#080a0c");for(const p of parts)px(...p)}
function addFx(kind,x,y,n=24){effects.push({kind,x,y,age:0,life:n,seed:Math.random()*6});if(effects.length>180)effects.shift()}
function line(points,color,width=2){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.stroke()}
function ring(x,y,r,color){ctx.strokeStyle=color;ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.stroke()}
function drawEffects(){for(const f of effects){const k=f.age/f.life;ctx.globalAlpha=1-k;const r=4+k*24;if(f.kind==="heal"){const x=f.x+(W*.13-f.x)*k,y=f.y+(H*.205-f.y)*k;px(x-2,y-3,5,7,"#ef5b6e");}
 else if(f.kind==="fire"){for(let i=0;i<5;i++)px(f.x+Math.sin(i*2)*r,f.y-k*26+i*2,3,7,"#f5ae51")}
 else if(f.kind==="leech"){for(let i=0;i<5;i++)px(f.x+Math.cos(i*1.3)*r,f.y+Math.sin(i*1.3)*r,3,5,"#e44862")}
 else if(f.kind==="poison"){for(let i=0;i<4;i++)ring(f.x+Math.sin(i*2)*r,f.y-k*15+i*3,3+k*3,"#96c660")}
 else if(f.kind==="frost"){for(let i=0;i<6;i++){const a=i*Math.PI/3;line([[f.x,f.y],[f.x+Math.cos(a)*r,f.y+Math.sin(a)*r]],"#bbeafa")}}
 else if(f.kind==="lightning")line([[f.x-r,f.y],[f.x-3,f.y-9],[f.x+4,f.y+7],[f.x+r,f.y-4]],"#fff1a4",3);
 else if(f.kind==="bomb"){ring(f.x,f.y,r*1.5,"#f5bc79");ring(f.x,f.y,r,"#d9714c")}
 else if(f.kind==="ghost"){ring(f.x,f.y-k*20,5+r*.4,"#c8b4f1")}
 else if(f.kind==="magnet"||f.kind==="guard"){ring(f.x,f.y,r,"#8bcfda");ring(f.x,f.y,r*.65,"#568899")}
 else if(f.kind==="chaos"){line([[f.x-r,f.y],[f.x,f.y-r],[f.x+r,f.y],[f.x,f.y+r],[f.x-r,f.y]],"#df8ed3")}
 else{for(let i=0;i<4;i++)px(f.x+Math.cos(i*2)*r,f.y+Math.sin(i*2)*r,3,3,"#b8ad89")}}
 ctx.globalAlpha=1;
}
function levelUp(){run.level=(run.level||1)+1;updateHud();const el=$("#levelToast");el.textContent="LEVEL UP  "+run.level;el.classList.remove("rise");void el.offsetWidth;el.classList.add("rise")}

function loop(){update();draw();requestAnimationFrame(loop)}
loop();
})();
</script>
