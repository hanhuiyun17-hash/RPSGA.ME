<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<title>STONEBALL — The Hollow Crown</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#11100d;font-family:monospace;touch-action:auto}
body{display:flex;justify-content:center}
#app{position:relative;width:100%;height:100%;max-width:520px;background:#171914;overflow:hidden}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
.hidden{display:none!important}
button,input{font:inherit}
button{cursor:pointer}

.panel{background:#c9aa70;color:#332417;border:5px solid #4b3421;box-shadow:inset 0 0 0 4px #8c673f,0 8px 0 #0c0a08}
.pixelBtn{min-height:44px;border:0;background:#69442a;color:#f5dfaa;font-weight:900;box-shadow:inset 0 0 0 4px #3d281a,0 5px 0 #21150e;padding:0 12px}
.pixelBtn:active{transform:translateY(3px);box-shadow:inset 0 0 0 4px #3d281a,0 2px 0 #21150e}

/* 시작 */
#titleScreen{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 78% 14%,#d5c58a 0 55px,#bca66c 56px 62px,transparent 63px),linear-gradient(rgba(9,12,10,.05),rgba(7,7,6,.75)),repeating-linear-gradient(90deg,#263727 0 44px,#2e3e2d 44px 88px)}
.titleCard{width:min(90%,390px);padding:20px 16px;text-align:center}
.gameTitle{font-size:30px;font-weight:900;letter-spacing:3px;margin-bottom:7px}
.sub{font-size:11px;line-height:1.6;color:#60472e;margin-bottom:14px}
.titleActions{display:grid;gap:9px}

/* 슬롯 */
#setupScreen{position:absolute;inset:0;z-index:45;display:flex;align-items:center;justify-content:center;padding:12px;background:linear-gradient(#273528,#141d16)}
.setupCard{width:min(96%,430px);padding:14px}
.setupTitle{text-align:center;font-size:20px;font-weight:900;margin-bottom:5px}
.setupDesc{text-align:center;font-size:11px;line-height:1.6;color:#5c452f;margin-bottom:12px}
#nameInput{width:100%;height:44px;border:4px solid #5c3f28;background:#ecd59d;color:#302116;padding:0 10px;outline:none;font-size:16px;margin-bottom:12px}
.slotWrap{display:grid;grid-template-columns:1fr 62px;gap:8px}
.slotMachine{background:#34271b;border:5px solid #4b3420;box-shadow:inset 0 0 0 4px #8d673a;padding:10px 8px 12px}
.reels{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.reelLabel{text-align:center;color:#e8d09a;font-weight:900;font-size:10px;margin-bottom:5px}
.reelWindow{height:68px;position:relative;overflow:hidden;background:#efe0b5;border:4px solid #67492b;box-shadow:inset 0 0 0 3px #b49359}
.reelNum{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;color:#302216}
.reelNum.spinning{animation:slotJitter .07s linear infinite}
@keyframes slotJitter{0%{transform:translateY(-8px)}50%{transform:translateY(8px)}100%{transform:translateY(-8px)}}
.slotSide{display:flex;align-items:center;justify-content:center;border:5px solid #4b3420;background:#7f5a34;box-shadow:inset 0 0 0 4px #a97b46}
#slotButton{width:38px;height:38px;border-radius:50%;border:5px solid #4e241e;background:#a5332b;box-shadow:0 5px 0 #4c211d,inset 0 0 0 3px #d55d51}
.totalLine{text-align:center;color:#f0d9a6;font-size:11px;font-weight:900;margin-top:7px}
#slotMessage{min-height:36px;text-align:center;font-size:11px;line-height:1.5;color:#4d3827;margin-top:9px}
#statsSetup{margin-top:8px;border-top:3px solid #8a643b;padding-top:7px}
.statRow{display:grid;grid-template-columns:62px 1fr 30px;gap:7px;align-items:center;padding:4px 2px;font-size:11px}
.statBar{height:11px;border:3px solid #553923;background:#9f7b49}
.statFill{height:100%;background:#4e693e;width:0}
.setupActions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}

/* 지도 */
#mapScreen{position:absolute;inset:0;z-index:30;background:linear-gradient(#202b22,#141a15);padding:12px;overflow:auto}
.mapTop{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.mapTitle{color:#ead6a4;font-weight:900;font-size:16px}
#mapArea{position:relative;min-height:630px;border:4px solid #4a3826;background:linear-gradient(#344236,#263127);box-shadow:inset 0 0 0 3px #1f251f}
.mapNode{position:absolute;width:108px;min-height:62px;padding:6px;border:4px solid #4a3422;background:#c7a76d;color:#332317;text-align:center;font-weight:900;font-size:10px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 #21170f}
.mapNode.locked{filter:brightness(.55)}
.mapNode.boss{background:#a96858}
.mapNode.chest{background:#d0b36f}
.mapNode.elite{background:#b27a5e}

/* 전투 HUD */
#hud{position:absolute;z-index:8;left:7px;right:7px;top:7px;display:flex;gap:6px;pointer-events:none}
.hudBox{background:#c8aa72;border:3px solid #4e3723;box-shadow:inset 0 0 0 2px #88643d;color:#332418;font-size:10px;padding:5px 7px;min-width:70px}
#statButton,#deckButton{pointer-events:auto;min-height:38px;border:3px solid #4e3723;background:#725035;color:#f2dba8;font-weight:900;padding:0 8px}
#turnBadge{position:absolute;z-index:8;top:58px;left:50%;transform:translateX(-50%);background:#5b4027;color:#f2dda8;border:3px solid #927049;padding:5px 10px;font-size:11px}
#battleInfo{position:absolute;z-index:8;left:50%;bottom:9px;transform:translateX(-50%);min-width:210px;max-width:92%;text-align:center;padding:8px 12px;background:#36281c;border:3px solid #997043;color:#f1d9a0;font-size:11px}

/* 보유 공 표시: 다음 순서 숨기고 존재만 */
#ownedOrbs{
  position:absolute;z-index:8;left:8px;right:8px;bottom:60px;
  display:flex;gap:5px;overflow-x:auto;padding-bottom:3px;pointer-events:none
}
.ownedChip{
  flex:0 0 auto;min-width:48px;padding:5px 6px;border:3px solid #4c3522;
  color:#1f1710;font-size:8px;text-align:center;font-weight:900;
  box-shadow:0 3px 0 #1c130d
}
.ownedChip.current{transform:translateY(-4px);outline:2px solid #f6e0a6}

/* 피해 연출 */
#damageFlash{position:absolute;inset:0;z-index:14;pointer-events:none;opacity:0;background:radial-gradient(circle at center,transparent 25%,rgba(120,0,0,.15) 55%,rgba(160,0,0,.75) 100%)}
#damageFlash.hit{animation:damageFlash .35s ease-out}
@keyframes damageFlash{0%{opacity:0}20%{opacity:1}100%{opacity:0}}
#floatingDamage{position:absolute;z-index:15;left:18%;top:18%;font-size:28px;font-weight:900;color:#ffb0a6;text-shadow:3px 3px 0 #4d1410;pointer-events:none;opacity:0}
#floatingDamage.show{animation:floatDamage .65s ease-out}
@keyframes floatDamage{0%{opacity:0;transform:translateY(10px) scale(.8)}20%{opacity:1}100%{opacity:0;transform:translateY(-35px) scale(1.15)}}

/* 팝업 */
.overlay{position:absolute;inset:0;z-index:60;background:#0d0a08c2;display:flex;align-items:center;justify-content:center;padding:14px}
.popup{width:min(94%,430px);max-height:88vh;overflow:auto;padding:14px}
.popup h3{margin:0 0 10px;text-align:center}
.popupClose{width:100%;margin-top:10px}
.choiceGrid{display:grid;gap:8px}
.choiceCard{border:4px solid #59402a;background:#e2c98f;padding:10px;color:#322317}
.choiceCard b{display:block;margin-bottom:4px}
.choiceCard button{width:100%;margin-top:8px}
.statusTag{display:inline-block;padding:2px 5px;margin:2px;border:2px solid #5b442f;background:#d6bb80;font-size:9px}
#messageOverlay{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:#100c087d;color:#f2dba6;font-size:20px;font-weight:900;text-align:center;pointer-events:none}

<body>
<div id="app">
<canvas id="game"></canvas>

<div id="titleScreen">
  <div class="titleCard panel">
    <div class="gameTitle">STONEBALL</div><div class="subtitle">THE HOLLOW CROWN</div>
    <div class="sub">뼈만 남은 방랑자, 공허의 왕관을 깨뜨려라.<br>돌을 모아 여덟 층을 돌파하세요</div>
    <div class="titleActions">
      <button id="continueBtn" class="pixelBtn hidden">이어하기</button>
      <button id="newGameBtn" class="pixelBtn">게임 시작하기</button>
    </div>
  </div>
</div>

<div id="setupScreen" class="hidden">
  <div class="setupCard panel">
    <div class="setupTitle">능력치 슬롯 머신</div>
    <div class="setupDesc">체력, 행운, 공격력, 방어력의 총합은 항상 12입니다.</div>
    <input id="nameInput" maxlength="10" placeholder="캐릭터 이름">
    <div class="slotWrap">
      <div class="slotMachine">
        <div class="reels">
          <div><div class="reelLabel">체력</div><div class="reelWindow"><div id="reel0" class="reelNum">?</div></div></div>
          <div><div class="reelLabel">행운</div><div class="reelWindow"><div id="reel1" class="reelNum">?</div></div></div>
          <div><div class="reelLabel">공격력</div><div class="reelWindow"><div id="reel2" class="reelNum">?</div></div></div>
          <div><div class="reelLabel">방어력</div><div class="reelWindow"><div id="reel3" class="reelNum">?</div></div></div>
        </div>
        <div class="totalLine">총합 <span id="totalStat">0</span> / 12</div>
      </div>

function loadGame(){
  try{
    const d=JSON.parse(localStorage.getItem(SAVE_KEY)||"null");if(!d)return false;
    stats=d.stats||[3,3,3,3];run=d.run;enemies=d.enemies||[];const migrating=run.balanceVersion!==5;if(migrating){const ratio=run.hp/Math.max(1,run.maxHp);run.maxHp=hpFor(stats[0]);run.hp=Math.max(1,Math.min(run.maxHp,Math.round(run.maxHp*ratio)));run.balanceVersion=5;}

    blocks=(d.blocks||[]).map(b=>({...b,x:b.x*W,y:b.y*H,w:b.w*W,h:b.h*H}));
    if(migrating){
      enemies.forEach(e=>{const ratio=e.hp/Math.max(1,e.maxHp),base=100+(run.stage-1)*36+(run.battleInStage-1)*8;e.maxHp=Math.round(base*(e.kind==="boss"?3+(run.battleInStage-1)*.25:enemies.length>1?.72:1));e.hp=Math.round(e.maxHp*ratio);e.atk=e.kind==="boss"?35+(run.battleInStage-1)*3:Math.round((8+(run.stage-1)*3.4+(run.battleInStage-1)*(1+run.stage*.12))*(enemies.length>1?.65:1))});
      if(!pegs.some(p=>p.permanent))for(let i=0;i<6;i++)pegs.push({x:W*(.12+.76*i/5),y:H*(i%2?.68:.58),r:10,dead:false,hit:false,type:i%3===0?"guard":"rune",permanent:false});
    }
    if(run.earlyHpVersion!==1){if(run.stage<=2)enemies.forEach(e=>{if(e.kind==="boss")return;const ratio=e.hp/Math.max(1,e.maxHp);e.maxHp=Math.min(99,(run.stage===1?65+(run.battleInStage-1)*7:75+(run.battleInStage-1)*6));e.hp=Math.round(e.maxHp*ratio)});run.earlyHpVersion=1;}
    if(run.pegBalanceVersion!==2){let guard=0,rune=0;for(const p of pegs){if(p.permanent&&p.hit)p.dead=true;p.permanent=false;if(p.type==="guard"&&guard++>=1)p.type="normal";if(p.type==="rune"&&rune++>=1)p.type="normal"}run.pegBalanceVersion=2;}
    run.bonusStats=run.bonusStats||[0,0,0,0];run.totalShots=run.totalShots||0;run.boardCycle=run.boardCycle||0;
    if(run.inventoryVersion!==2){while(run.deck.length<30){const o={uid:"migrate"+run.deck.length+"_"+Date.now(),id:"orb1",level:0};run.deck.push(o);if(["battle","boss","chest"].includes(d.mode))run.drawPile.push({...o})}run.inventoryVersion=2;}
    initExpansion(false);run.stock=run.stock||{orb1:3};run.runes=normalizeRunes(run.runes);run.barrierHits=run.barrierHits||0;run.level=run.level||Math.max(1,stats.reduce((a,b)=>a+b,0)-11);delete run.items;run.shopBought=run.shopBought||{};turn=d.turn||"player";showMode(d.mode||"map");if(mode==="map"&&run.map)showMap();else if(["battle","boss","chest","treasure"].includes(mode))resetStone();updateHud();updateOwnedOrbs();if(run.pending==="reward")showOrbReward(advanceEncounter);if(run.pending==="growth")showStatPointPopup(afterStage);if(run.pending==="victory")showVictory();if(run.pending==="loadout")showLoadout();if(run.pending==="boss_warning")showBossWarning();if(run.pending==="battle_shop")showBattleShop();if(run.pending==="secret")showSecretReward();if(run.pending==="reviving")resumeRevival();if(run.pending==="dead")runDeath(true);if(run.pending==="battle_clear")encounterCleared();if(run.pending==="bonus_slot")showBonusSlot();if(run.pending==="treasure_reward"||run.pending==="treasure_flying")treasureResult();else if(run.pending==="treasure"){showMode("treasure");turnBadge.textContent="상자방  남은 기회 1";ownedOrbs.classList.add("hidden");}
    if(d.turn==="enemy"&&!run.pending&&run.enemyQueue?.length){turn="enemy";attackLocked=true;setTimeout(continueEnemyTurn,600)}
    return true;
  }catch(e){return false}
}

const NODE_NAMES=["검은 숲","부서진 성채","젖은 동굴","잊힌 묘지","황혼 협곡","고블린 길목","오래된 수로"];
function generateMap(){
  const nodes=[];
  for(let s=1;s<=7;s++){
    const count=s===1||s===7?1:2;
    for(let lane=0;lane<count;lane++){
      let type="battle";
      
      if(s>=5&&Math.random()<.12)type="elite";
      nodes.push({id:nodes.length,stage:s,lane,type,name:NODE_NAMES[(s+lane)%NODE_NAMES.length],unlocked:s===1,done:false});
    }
  }
  nodes.push({id:nodes.length,stage:8,lane:0,type:"boss",name:"공허의 왕좌",unlocked:false,done:false});
  run.map={nodes};
}

/* 판 배치 */
function createBoard(type){
  pegs=[];blocks=[];
  const cycle=run.boardCycle||0;const easy=run.stage<=2&&cycle===0;const luck=Math.min(12,stats[1])/12;
  const top=H*.35,bottom=H*.79;
  const rows=type==="boss"?10:type==="chest"?6:(easy?8:7);
  const cols=type==="boss"?8:type==="chest"?5:(W<390?6:7);
  const gx=W/(cols+1)*(1-luck*.06),gy=(bottom-top)/Math.max(1,rows-1);
  const patterns=cycle>0?["tunnel","walls","gap","doublegap","maze","pinch","stairs","split"]:easy?["dense","triangle","zigzag"]:run.stage<5?["triangle","zigzag","gap","tunnel","stairs","split","doublegap","walls","diamond","columns","checker","funnel"]:["gap","tunnel","stairs","split","doublegap","walls","diamond","columns","checker","funnel","hourglass","cross","islands","ramp","spiral","pinch","arch","fortress","maze","offset"];
  const pool=patterns.filter(x=>x!==run.lastPattern);const pattern=type==="boss"&&cycle===0?["dense","zigzag","split","diamond","dense"][run.battleInStage-1]:pool[Math.floor(Math.random()*pool.length)];run.lastPattern=pattern;run.boardName=pattern;

  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    let x=gx+c*gx+(r%2?gx*.5:0),y=top+r*gy;
    if(pattern==="zigzag")x+=Math.sin(r*1.3)*gx*.23;
    if(x>W-gx*.55)continue;
    if(pattern==="gap"&&Math.abs(x-W*.5)<gx*(.65-luck*.15)&&r>1&&r<rows-2)continue;
    if(pattern==="doublegap"&&((x>W*.25&&x<W*.4)||(x>W*.62&&x<W*.77))&&r>1)continue;
    if(pattern==="split"&&r%2===1&&c%3===1)continue;
    if(pattern==="stairs"&&c<Math.floor(r/2)-1)continue;
    if(pattern==="triangle"&&Math.abs(c-(cols-1)/2)>r*.45+1)continue;
    if(pattern==="diamond"&&Math.abs(c-(cols-1)/2)+Math.abs(r-(rows-1)/2)*.6>cols*.53)continue;
    if(pattern==="columns"&&c%3===1)continue;
    if(pattern==="checker"&&(r+c)%3===0)continue;
    if(pattern==="funnel"&&Math.abs(c-(cols-1)/2)<(rows-r)*.25)continue;
    if(pattern==="hourglass"&&Math.abs(c-(cols-1)/2)<(rows/2-Math.abs(r-rows/2))*.35)continue;
    if(pattern==="cross"&&(Math.abs(c-(cols-1)/2)<1||Math.abs(r-(rows-1)/2)<1))continue;
    if(pattern==="islands"&&c%3===1&&r%3===1)continue;
    if(pattern==="ramp"&&c<r%cols-1)continue;
    if(pattern==="spiral"&&r%3===0&&c>cols/2)continue;
    if(pattern==="pinch"&&r>1&&r<rows-2&&Math.abs(c-(cols-1)/2)<1.5)continue;
    if(pattern==="arch"&&r<3&&c>1&&c<cols-2)continue;
    if(pattern==="fortress"&&r>1&&r<rows-1&&c>1&&c<cols-2)continue;
    if(pattern==="maze"&&(r%3===1?c<cols-2:c>1)&&r%2===1)continue;
    if(pattern==="offset"&&r%2===0&&c%3===0)continue;
    x+=W*luck*.03;
    x+=(Math.random()-.5)*(easy?4:14);
    y+=(Math.random()-.5)*(easy?3:9);
    const chance=critChance();
    pegs.push({x,y,r:Math.max(6,9-cycle*.6),dead:false,hit:false,type:Math.random()<chance?"critical":"normal"});
  }

  if(!easy&&type!=="chest"){
    if(pattern==="tunnel"){
      blocks.push({x:W*.18,y:H*.48,w:W*.24,h:14},{x:W*.58,y:H*.48,w:W*.24,h:14});
    }else if(pattern==="walls"){
      blocks.push({x:W*.34,y:H*.46,w:16,h:H*.16},{x:W*.66,y:H*.56,w:16,h:H*.16});
    }else{

}
function reflectBlock(b,d){
  if(d.effect==="ghost")return;
  const l=Math.abs(stone.x-(b.x-stone.r)),r=Math.abs(stone.x-(b.x+b.w+stone.r)),t=Math.abs(stone.y-(b.y-stone.r)),bt=Math.abs(stone.y-(b.y+b.h+stone.r));
  const m=Math.min(l,r,t,bt),boost=d.effect==="chaos"?1.03:.97;
  if(m===l){stone.x=b.x-stone.r;stone.vx=-Math.abs(stone.vx)*boost}
  else if(m===r){stone.x=b.x+b.w+stone.r;stone.vx=Math.abs(stone.vx)*boost}
  else if(m===t){stone.y=b.y-stone.r;stone.vy=-Math.abs(stone.vy)*boost}
  else{stone.y=b.y+b.h+stone.r;stone.vy=Math.abs(stone.vy)*boost}
}

   if(phase===2){pegs.filter(p=>!p.dead&&!p.permanent).slice(0,6).forEach(p=>p.locked=2);if(livingEnemies().length<4){const hp=Math.round(e.maxHp*.08);enemies.push({uid:'summon_'+Date.now(),name:'왕관의 파편',kind:'goblin',hp,maxHp:hp,atk:8+run.stage,status:{poison:0,burn:0,frost:0}})}}
   if(phase===3){e.atk+=4;run.modifier="bounce";blocks.push({x:W*.68,y:H*.56,w:15,h:H*.12,kind:"iron"})}
   showMessage('왕관의 균열 '+phase,650);addFx('abyss',W*.79,H*.205,45);
  }
 }
}
function dealEnemyDamage(e,value,ignoreArmor=false){
 if(!e||e.hp<=0)return 0;let n=Math.max(1,Math.round(value));if(!ignoreArmor){if(e.kind==="knight")n=Math.max(1,Math.round(n*.85));if(e.shield>0){const blocked=Math.min(e.shield,n);e.shield-=blocked;n-=blocked}}
 const actual=Math.min(e.hp,n);if(actual>0){e.hitAnim=24;const pos=enemyPositions(),idx=livingEnemies().indexOf(e);hitNumbers.push({x:W*(pos[idx]||.79),y:H*.205-15,value:actual,age:0,offset:Math.random()*16-8});if(hitNumbers.length>24)hitNumbers.shift();addFx(currentDef().effect,W*(pos[idx]||.79),H*.205,32)}e.hp=Math.max(0,e.hp-n);run.metrics.totalDamage+=actual;return actual;
}
function applyPlayerHit(dmg,crit=false){if(dmg<=0)return;run.hp=Math.max(0,run.hp-dmg);run.battleDamageTaken=(run.battleDamageTaken||0)+dmg;heroAnim.hit=20;screenShake=crit?11:7;showPlayerDamage(dmg,crit);spawnParticles(W*.13,H*.205,'#d9d4b8',8);updateHud()}
function handlePlayerDown(resume){
 if(run.hp>0)return false;
 if(hasRune(31)){run.runes=run.runes.filter(id=>id!==31);run.reviveResume=resume;run.pending="reviving";run.revivingHp=Math.max(1,Math.round(run.maxHp*.4));stone.active=false;projectiles=[];launchPending=null;saveGame(true);resumeRevival();return true}
 runDeath();return true;
}
function resumeRevival(){
 if(reviveTimer)return;const overlay=$("#reviveOverlay");$("#reviveSigil").innerHTML=runeIcon(31);overlay.classList.remove("hidden");overlay.classList.add("reviving");uiPaused=true;
 reviveTimer=setTimeout(()=>{reviveTimer=null;run.hp=run.revivingHp||Math.max(1,Math.round(run.maxHp*.4));run.pending=null;overlay.classList.add("hidden");overlay.classList.remove("reviving");uiPaused=false;heroAnim.hit=0;updateHud();const route=run.reviveResume;run.reviveResume=null;saveGame(true);if(route==="afterPlayer")afterPlayerAction();else if(route==="enemyEnd")finishEnemyRound();else continueEnemyTurn()},1850);
}
function afterPlayerAction(){
 awardKills();if(!livingEnemies().length){run.pending='battle_clear';saveGame(true);showMessage('전투 승리',550);setTimeout(encounterCleared,580);return}checkBossPhases();enemyTurn();
}
function continueEnemyTurn(){
 if(run.pending==="dead"||run.pending==="reviving")return;turn="enemy";attackLocked=true;
 if(run.enemyCursor>=run.enemyQueue.length){finishEnemyRound();return}
 const uid=run.enemyQueue[run.enemyCursor++],e=enemies.find(e=>e.uid===uid);
 if(!e||e.hp<=0){saveGame(true);setTimeout(continueEnemyTurn,30);return}
 if(e.affix==="regen")e.hp=Math.min(e.maxHp,e.hp+Math.ceil(e.maxHp*.04));if(e.affix==="rage")e.rage=Math.min(.4,(e.rage||0)+.06);
 const intent=e.intent||{kind:'attack',raw:e.atk,crit:false};
 if(intent.kind==="charge"){battleInfo.textContent=e.name+'이 힘을 모읍니다';saveGame(true);setTimeout(continueEnemyTurn,600);return}
 if(e.status.frost>=3){e.status.frost-=3;battleInfo.textContent='얼어붙어 움직이지 못합니다';saveGame(true);setTimeout(continueEnemyTurn,600);return}
 e.attackAnim=18;const dmg=incomingDamage(intent.raw);
 if(run.barrierHits>0){run.barrierHits--;addFx('guard',W*.13,H*.205,32);battleInfo.textContent='보호막이 공격을 막았습니다'}else{const blocked=Math.min(run.shield||0,dmg);run.shield=Math.max(0,(run.shield||0)-blocked);if(blocked>0){addFx("guard",W*.13,H*.205,32);showMessage("방패가 피해 "+blocked+" 흡수",450)}applyPlayerHit(dmg-blocked,intent.crit);if(intent.kind==="poison"&&dmg>blocked)run.playerPoison=Math.min(6,run.playerPoison+2)}
 if(run.reflectTurns>0)dealEnemyDamage(e,run.reflectDamage||4,true);awardKills();updateHud();saveGame(true);if(handlePlayerDown('enemy'))return;setTimeout(continueEnemyTurn,600);
}
function finishEnemyRound(){
 if(!run.enemyEndApplied){run.enemyEndApplied=true;for(const p of pegs){p.hit=false;if(p.locked>0)p.locked--}
 for(const e of livingEnemies()){if(e.status.poison>0)dealEnemyDamage(e,e.status.poison,true);if(e.status.burn>0){dealEnemyDamage(e,e.status.burn+(hasRune(35)?1:0),true);e.status.burn=Math.max(0,e.status.burn-1)}}
 if(run.playerPoison>0){applyPlayerHit(Math.min(3,run.playerPoison));run.playerPoison--}if(run.reflectTurns>0)run.reflectTurns--;if(hasRune(17)&&run.combatTurn%3===0)run.hp=Math.min(run.maxHp,run.hp+1);
 awardKills();saveGame(true);if(handlePlayerDown('enemyEnd'))return;
 }
 if(!livingEnemies().length){encounterCleared();return}
 resetStone();refillBoardIfEmpty();planEnemyIntents();prepareMerchant();updateHud();updateOwnedOrbs();saveGame(true);
}
function finishPlayerTurn(){
 if(mode==="treasure"){treasureResult();return}if(attackLocked)return;attackLocked=true;stone.active=false;
 const used=run.currentOrb,d=currentDef(),target=livingEnemies().find(e=>e.uid===run.targetUid)||livingEnemies()[0];let finalDamage=shotDamage(damage,critical);
 if(d.effect==="blood")finalDamage=Math.round(finalDamage*(1+(1-run.hp/run.maxHp)*.45));if(d.effect==="lava"&&target)finalDamage=Math.round(finalDamage*(1+Math.min(.5,target.status.burn*.025)));if(d.effect==="reaper"&&target&&target.hp<=target.maxHp*.25)finalDamage=Math.round(finalDamage*1.6);if(d.effect==="crown"&&target?.kind==="boss")finalDamage=Math.round(finalDamage*1.35);if(d.effect==="disaster")finalDamage=Math.round(finalDamage*1.4);if(setCount("frost")>=3&&target?.status.frost>0&&(d.effect==="frost"))finalDamage=Math.round(finalDamage*1.15);
 run.metrics.maxDamage=Math.max(run.metrics.maxDamage,finalDamage);run.metrics.uses[used.id]=(run.metrics.uses[used.id]||0)+1;
 if(target){const before=target.hp;dealEnemyDamage(target,finalDamage,run.ignoreArmor);const lv=used.level||0;
 if(hitCount>0){
  if(d.effect==="leech"){run.hp=Math.min(run.maxHp,run.hp+Math.max(1,Math.round(finalDamage*(.14+lv*.025+(combo('leech')?.1:hasRune(2)?.05:0)))));addFx('heal',W*.79,H*.205,45)}
  if(['poison','infection'].includes(d.effect)){target.status.poison=Math.min(24,target.status.poison+Math.round((1+lv)*stagePower()+(combo('poison')?3:hasRune(3)?2:0)));if(d.effect==="infection")for(const e of livingEnemies())if(e!==target)e.status.poison=Math.max(e.status.poison,Math.ceil(target.status.poison*.6))}
  if(['fire','lava'].includes(d.effect)){target.status.burn=Math.min(30,target.status.burn+Math.round((2+lv)*stagePower()+(combo('fire')?3:hasRune(0)?2:0)+(setCount('fire')>=2?1:0)));if(setCount('fire')>=3&&d.effect==='fire'&&target.status.burn>=5){for(const e of livingEnemies())if(e!==target)dealEnemyDamage(e,target.status.burn*2,true);addFx('bomb',W*.78,H*.205,40)}}
  if(d.effect==="frost"){target.status.frost+=1+lv+(hasRune(1)?1:0)+(hasRune(36)?1:0)+(setCount('frost')>=2?1:0);if(combo('frost'))run.barrierHits=Math.min(5,(run.barrierHits||0)+1)}
  if(['lightning','storm'].includes(d.effect)){const ratio=d.effect==='storm'?.35:combo('lightning')?.4:hasRune(4)?.35:.25;for(const e of livingEnemies())if(e!==target)dealEnemyDamage(e,finalDamage*ratio);addFx('lightning',W*.72,H*.205,35)}
  if(['guard','bastion'].includes(d.effect)&&hitCount>=3){run.barrierHits=Math.min(5,(run.barrierHits||0)+2+(combo('guard')||hasRune(18)||hasRune(8)?1:0));addFx('guard',W*.13,H*.205,45)}
  if(d.effect==='thorn'){run.reflectTurns=2;run.reflectDamage=Math.round(4*stagePower())}
 }
 if(finalDamage>before*1.5&&target.hp===0){showMessage('OVERKILL',500);if(Math.random()<.2){run.fragments++;run.coins+=3}}
 if(target.affix==='thorn'&&hitCount>0)applyPlayerHit(Math.max(1,Math.round(run.stage*.7)));
 }
 if(d.effect==='disaster')applyPlayerHit(Math.max(1,Math.ceil(run.maxHp*.04)));
 stone.trail=[];
 if(d.special){if(!run.usedSpecials.includes(used.id))run.usedSpecials.push(used.id);run.currentOrb=run.heldNormal;run.heldNormal=null;if(!run.currentOrb)drawNextOrb()}else{run.discardPile.push(used);drawNextOrb()}
 awardKills();updateHud();saveGame(true);if(handlePlayerDown('afterPlayer'))return;afterPlayerAction();
}
function enemyTurn(){
 run.combatTurn=(run.combatTurn||0)+1;run.enemyQueue=livingEnemies().flatMap(e=>e.kind==="bat"?[e.uid,e.uid]:[e.uid]);run.enemyCursor=0;run.enemyEndApplied=false;turn="enemy";turnBadge.textContent="적의 차례";battleInfo.textContent="적이 공격을 준비합니다";attackLocked=true;updateOwnedOrbs();saveGame(true);setTimeout(continueEnemyTurn,600);
}
function throwStone(){
 if(!run.currentOrb||stone.active||launchPending||attackLocked||run.pending&&mode!=="treasure")return;
 if(mode==='treasure'&&run.treasure.shotUsed)return;
 let dx=aimX-stone.x,dy=Math.max(40,aimY-stone.y),len=Math.hypot(dx,dy)||1;let nx=dx/len,ny=Math.max(.3,dy/len),n=Math.hypot(nx,ny);nx/=n;ny/=n;
 const power=1;launchPending={nx,ny,power};heroAnim.throw=18;heroAnim.power=power;stone.aiming=false;attackLocked=true;updateOwnedOrbs();
}
function launchVolley(){
 if(!launchPending)return;const shot=launchPending;launchPending=null;attackLocked=false;
 if(mode==='treasure'){run.treasure.shotUsed=true;run.pending='treasure_flying';saveGame(true);turnBadge.textContent='상자방  남은 기회 0'}else run.totalShots++;
 if(orbDef(run.currentOrb.id).specialKey==='void')run.voidEffect=['fire','poison','frost','leech','lightning','ghost','bomb','magnet','chaos'][Math.floor(Math.random()*9)];
 const d=currentDef();run.shotPower=shot.power;run.ignoreArmor=d.effect==='abyss'&&Math.random()<.35;run.cloneTriggered=false;run.runePegPaid=false;
 const speed=d.speed*shot.power*(run.modifier==='swift'?1.15:1);stone.flight=0;stone.r=d.r;stone.color=d.color;stone.vx=shot.nx*speed;stone.vy=shot.ny*speed;stone.active=true;
 const count=mode==='treasure'?1:1+Math.min(2,runeCount(30)),a=Math.atan2(stone.vy,stone.vx);projectiles=Array.from({length:count},(_,i)=>{const angle=a+(i-(count-1)/2)*.17;return {...stone,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,trail:[],damageScale:1,active:true}});updateOwnedOrbs();
}
function updateProjectile(){
 if(!stone.active)return;stone.flight=(stone.flight||0)+1;if(stone.flight>1500){stone.active=false;return}const d=currentDef(),dt=d.effect==='time'?.6:1;
 if(d.effect==='magnet'){let nearest=null,nd=Infinity;for(const p of pegs)if(!p.dead){const distance=Math.hypot(stone.x-p.x,stone.y-p.y);if(distance<nd){nearest=p;nd=distance}}if(nearest&&nd>0&&nd<130){const k=hasRune(6)?.035:.02;stone.vx+=(nearest.x-stone.x)/nd*k;stone.vy+=(nearest.y-stone.y)/nd*k}}
 if(d.effect==='gravity'||run.gravityPulse>0){stone.vx+=(W*.5-stone.x)*.00065;for(const p of pegs)if(!p.dead&&Math.hypot(p.x-stone.x,p.y-stone.y)<110)p.x+=(W*.5-p.x)*.001}
 const gravity=.105*(run.modifier==='gravity'?1.35:1);stone.vy+=gravity*dt;stone.x+=stone.vx*dt;stone.y+=stone.vy*dt;stone.trail.push({x:stone.x,y:stone.y,life:14});if(stone.trail.length>18)stone.trail.shift();
 const bounce=d.effect==='antigravity'?1.12:run.modifier==='bounce'?1.06:.96;
 if(stone.x<stone.r+5){stone.x=stone.r+5;stone.vx=Math.min(22,Math.abs(stone.vx)*bounce);addFx(d.effect==='antigravity'?'antigravity':'normal',stone.x,stone.y,15)}
 if(stone.x>W-stone.r-5){stone.x=W-stone.r-5;stone.vx=-Math.min(22,Math.abs(stone.vx)*bounce);addFx(d.effect==='antigravity'?'antigravity':'normal',stone.x,stone.y,15)}
 for(const b of blocks)if(circleRect(stone.x,stone.y,stone.r,b))reflectBlock(b,d);
 for(const p of pegs){if(p.dead)continue;const dx=stone.x-p.x,dy=stone.y-p.y,dist=Math.hypot(dx,dy),min=stone.r+p.r;if(dist<min){const dd=dist||1,nx=dist?dx/dd:1,ny=dist?dy/dd:0;stone.x=p.x+nx*min;stone.y=p.y+ny*min;const dot=stone.vx*nx+stone.vy*ny;if(dot<0){stone.vx=(stone.vx-2*dot*nx)*.975;stone.vy=(stone.vy-2*dot*ny)*.975}hitPeg(p,d)}}
 if(stone.y>H+38)stone.active=false;
}

function loop(){update();draw();requestAnimationFrame(loop)}
loop();
})();
